aid: immunis
name: Immunis
description: >-
  Immunis, Inc. is a private, clinical-stage biotechnology company headquartered in Irvine,
  California, developing immunomodulatory secretome biologics — the mixture of proteins and factors
  secreted by stem cells, rather than the cells themselves — as a treatment for age- and
  disease-related immune decline. Its lead candidate, IMM01-STEM, is under study in the STEM-MYO
  Phase 1/2a trial for muscle atrophy and sarcopenia, alongside a STEM-META Phase 2 program and a
  STEM-K9 veterinary program. Immunis is a therapeutics developer, not a software company: it
  publishes no developer portal, API, SDK, webhook surface, or machine-readable API contract of any
  kind. Its entire public surface is a WordPress marketing and clinical-trial-recruitment site whose
  only machine-readable endpoint is the default WordPress REST API at /wp-json/, which serves the
  CMS of that site and is not an Immunis API product.
